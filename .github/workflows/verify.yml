name: Verify

# Pull requests and `main`. GitHub Free gives unlimited Actions minutes on
# public repositories and 2,000 a month on private ones; this workflow is sized
# to stay well inside that (instruction section 45).
#
# v227 - a branch with an open pull request used to run everything twice, once
# for the push and once for the pull request, and the private repository ran
# out of minutes. Feature branches still run through their pull request only.
# `main` runs on every push, because it is the last chance before Production.
#
# v326 removed the `paths-ignore` that let a documentation-only pull request
# run nothing. It was sound while nothing was required to merge, and unsound
# the moment anything is: GitHub counts a *skipped* required check as a
# successful one, and a workflow that never triggers reports nothing at all —
# so the same filter either blocks a documentation pull request forever or
# waves one through with no verification, depending on how the protection is
# written. The repository is public, where standard runners are unlimited, so
# the saving it bought is worth nothing and the ambiguity it bought is worth
# less. Every pull request now runs every job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    # The gates that need no database. Fast, and they catch most of what a
    # branch gets wrong.
    name: Format, lint, types, unit, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone cannot answer "was a secret ever committed", and
          # that question is the point of the scan below.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Secret scan
        run: npm run scan:secrets

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: SQL syntax
        run: npm run check:sql

  database:
    # The gates that need Postgres. Runs the real migrations against a real
    # server, so drift and broken SQL are caught here rather than at cutover.
    name: Migrations, RLS and integration
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start the local Supabase stack
        run: npx supabase start -x realtime,imgproxy,edge-runtime,logflare,vector,pooler

      - name: Write the environment CI resolves to
        run: node scripts/write-env.mjs
        env:
          TAMCO_ENV: local

      - name: Schema executes
        run: npm run check:schema

      - name: Generated types match the schema
        run: npm run db:types:check

      - name: RLS and database tests
        run: npm run db:test

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      # The local gate runs this and CI did not, so the two could disagree on
      # a build that starts but does not serve. A gate that is a subset of the
      # other reports a green the other can contradict, whichever way round
      # the subset runs.
      - name: Production smoke
        run: npm run test:smoke

  # End-to-end runs on everything that reaches this workflow: pull requests,
  # pushes to `main`, and manual dispatches.
  #
  # It used to run on `main` and on dispatch only, because the repository was
  # private and GitHub Free gives 2,000 Actions minutes a month there. It is
  # public now, where standard runners are unlimited, so the reason is gone —
  # and what it was costing was the thing this suite exists for. A pull
  # request could go green having executed no browser test at all, which is
  # how `settings-menu-reveals-v243` stayed red on `main` from 8 to 9
  # November: the last browser evidence came from a dispatch, and every pull
  # request merged in between reported success on two jobs out of three.
  #
  # If minutes ever become a constraint again, narrow this by path rather than
  # by event: a change under `supabase/` or `docs/` has no browser surface,
  # while one under `src/app` or `src/components` always does.
  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: database
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start the local Supabase stack
        run: npx supabase start -x realtime,imgproxy,edge-runtime,logflare,vector,pooler

      - name: Write the environment CI resolves to
        run: node scripts/write-env.mjs
        env:
          TAMCO_ENV: local

      - name: End-to-end tests
        run: npm run test:e2e

      # Always, not only on failure: a green run is the one worth reading when
      # the question is what it skipped. `team-figures-v136` sat dormant from
      # v233 to v254 behind a silent skip, and no artifact survived a pass to
      # show it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
