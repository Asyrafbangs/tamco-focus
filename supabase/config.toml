# TAMCO Focus — local Supabase stack configuration.
#
# This file describes the LOCAL development stack only. It is never linked to a
# hosted Supabase project during the current build stage.

project_id = "tamco-focus"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Bounds the rows any single PostgREST request can return, so a mis-scoped
# query cannot stream the whole table.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# Local mail catcher. Weekly summaries and transactional notification emails
# write to their delivery logs and, when EMAIL_TRANSPORT=inbucket, also deliver
# here for visual inspection.
enabled = true
port = 54324
smtp_port = 54325

[storage]
enabled = true
# Local ceiling for every bucket. The authoritative per-file limits live in
# ATTACHMENT_MAX_BYTES and EVIDENCE_MAX_BYTES and are enforced in the domain
# layer and by each bucket definition; this only has to be above the largest of
# them. v226 raised finding evidence to 25 MiB, so this rose with it.
file_size_limit = "26MiB"

[auth]
# ---------------------------------------------------------------------------
# LOCAL VALUES ONLY. Do not run `supabase config push` against Production.
#
# This file has no [auth.email.smtp] block and sets enable_confirmations =
# false, both of which are correct for a local stack and wrong for the hosted
# project. A push would therefore overwrite the Brevo relay with nothing and
# set the hosted Site URL to localhost — which is precisely the failure it
# would look like it was fixing: a recovery email whose link points at a
# machine the recipient does not have.
#
# The hosted project's Site URL and Redirect URLs are maintained in the
# Supabase dashboard. The application no longer depends on them for the reset
# link's origin — `requestOrigin()` reads it from the request — but Supabase
# still refuses a `redirect_to` that is not on the allow-list, so the hosted
# callback URL has to be listed there.
# ---------------------------------------------------------------------------
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Administrators provision every account through the user directory. Public
# self-signup is closed.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Keeps the email provider ENABLED, which is what allows sign-in at all.
# Setting this false disables email logins entirely, not just registration —
# self-registration is closed by `enable_signup = false` in the [auth] block
# above, which is the correct lever for "administrators provision every account"
# (MASTER_PRODUCT_SPEC.md section 31B.1).
enable_signup = true
double_confirm_changes = true
# Local-only. Seeded accounts are created pre-confirmed so tests can sign in
# without an inbox round-trip.
enable_confirmations = false
secure_password_change = true

[auth.email.template.invite]
subject = "You have been added to TAMCO Focus"

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
