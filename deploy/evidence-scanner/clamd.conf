# clamd for a background evidence scanner (v271).
#
# Only the shim talks to it, over the loopback interface inside the container,
# so there is no TCP exposure to reason about beyond the shim's own token.
LogFile /dev/stdout
LogTime yes
PidFile /tmp/clamd.pid
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 127.0.0.1
MaxThreads 4
MaxScanSize 100M
MaxFileSize 30M
StreamMaxLength 30M

# The important line. ClamAV's own documentation asks for 4GB because a
# concurrent reload builds the new engine beside the old one and briefly
# doubles a ~1.2GB footprint. Serialising the reload halves that peak, at the
# cost of blocking scans for a few seconds while it happens -- which costs a
# background job nothing, and lets this run on a 2GB machine.
ConcurrentDatabaseReload no
